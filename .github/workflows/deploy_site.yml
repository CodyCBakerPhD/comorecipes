name: Deploy site to gh-pages
on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - database-updated  # sent by the database repo when its main branch changes
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Check out the recipe database
        uses: actions/checkout@v7
        with:
          repository: CodyCBakerPhD/comorecipes-database
          path: database

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview  # keep open PR previews alive across deploys
          force: false
