name: Deploy Executable
run-name: ${{ github.actor }} is deploying a release for CoMo Recipes

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Fresh install of package
        run: python -m pip install -e .

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: pyinstaller --onefile _interactive_console_builder.py --name como_recipes

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/como_recipes.exe
          asset_name: como_recipes.exe
          tag: ${{ github.ref }}
          overwrite: true
          body: "Official release of CoMo Recipes interactive console"
