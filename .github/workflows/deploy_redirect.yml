name: Deploy redirect to gh-pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Assemble the redirect pages
        run: |
          mkdir dist
          cp redirect/index.html dist/index.html
          cp redirect/index.html dist/404.html  # so deep links to recipe pages redirect too
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          force: false
