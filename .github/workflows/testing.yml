name: Test installation and run tests
on:
  workflow_call:

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / tests / ubuntu'
    # Action dashboard identified by 'Test installation and run tests'
    # Requirement settings identified as 'tests / ubuntu'
    name: ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Get date
        id: get_date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore cached virtualenv
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.get_date.outputs.date }}-${{ hashFiles('pyproject.toml') }}
          path: ~/testing_environment

      - name: Install Pytest
        run: |
          python -m venv ~/testing_environment
          source ~/testing_environment/bin/activate
          python -m pip install -U pip
          python -m pip install pytest
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Save cached virtualenv
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.get_date.outputs.date }}-${{ hashFiles('pyproject.toml') }}
          path: ~/testing_environment

      - name: Fresh install of package
        run: python -m pip install -e .

      - name: Run pytest
        run: pytest tests -vv -rsx
