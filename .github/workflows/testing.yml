name: Installation
on: pull_request
jobs:
  run:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Get current year-month
        id: date
        run: echo "::set-output name=date::$(date+'%Y-%m')"
      - uses: actions/cache@v2
        id: cache-venv
        with:
          path: ~/test_env
          key: ${{ runner.os }}-venv-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-venv-
    
      - uses: actions/checkout@v2
        if: steps.cache-venv.outputs.cache-hit == false
      - if: steps.cache-venv.outputs.cache-hit == false
        run: git fetch --prune --unshallow --tags
      - name: Setup Python
        if: steps.cache-venv.outputs.cache-hit == false
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install pytest
        if: steps.cache-venv.outputs.cache-hit == false
        run: |
          pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run Tests
         run: pytest
