name: Test Installation and Check Recipes
on: workflow_call

jobs:

  run:
    # Will read on PR dashboard as 'Deploy / Tests / ubuntu'
    # Action dashboard identified by 'Test Installation and Check Recipes'
    # Requirement settings identified as 'Tests / ubuntu'
    name: ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Restore cached virtualenv
        uses: actions/cache/restore@v4
        with:
          key: ${{ hashFiles('pyproject.toml') }}
          path: .venv

      - name: Install Pytest
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install pytest
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Save cached virtualenv
        uses: actions/cache/save@v4
        with:
          key: ${{ hashFiles('pyproject.toml') }}
          path: .venv

      - name: Fresh install of package
        run: python -m pip install -e .

      - name: Run Tests
        run: python -m pytest
