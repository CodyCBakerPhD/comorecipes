name: Add Issue or Pull Request to Project

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    name: Add to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/codycbakerphd/codycbakerphd/como-recipes/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
