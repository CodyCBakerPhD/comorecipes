name: Deploy

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  Pre-commit:
    uses: ./.github/workflows/pre_commit.yml
    with:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Tests:
    needs: pre-commit
    uses: ./.github/workflows/testing.yml
