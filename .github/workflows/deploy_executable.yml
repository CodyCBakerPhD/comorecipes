name: Deploy Executable
run-name: ${{ github.actor }} is deploying a release for CoMo Recipes

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Deploy with ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2019]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Fresh install of package
        run: python -m pip install -e .

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: pyinstaller --onefile src/como_recipes/_interactive_console_builder.py --name como_recipes-${{ matrix.os }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./dist/como_recipes-${{ matrix.os }}.exe
          asset_name: como_recipes-${{ matrix.os }}.exe
          tag: ${{ github.head_ref }}
          overwrite: true
          body: "Official release of CoMo Recipes interactive console"
          draft: true
