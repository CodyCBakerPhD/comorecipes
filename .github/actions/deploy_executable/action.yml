name: Deploy Executable
description: Deploy a single executable for a platform/architecture/version combination.
inputs:
  os:
    description: Operating system (versioned)
    required: true
  GITHUB_TOKEN:
    description: The secret GitHub token with admin privileges
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13

    - name: Fresh install of package
      run: python -m pip install -e .
      shell: bash

    - name: Get package version for tag
      id: package_version
      run: echo "value=$(como_recipes_version)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Get executable stem
      id: executable_stem
      run: echo "value=$(como_recipes_executable_stem)" >> $GITHUB_OUTPUT
      shell: bash

    - name: Set package base path
      id: base_path
      run: echo "COMO_RECIPES_BASE_PATH=$(como_recipes_print_base_environment_variable)" >> $GITHUB_ENV
      shell: bash

    - name: Check package base path was set correctly
      run: echo $COMO_RECIPES_BASE_PATH
      shell: bash

    - name: Install PyInstaller
      run: python -m pip install pyinstaller
      shell: bash

    - name: Build Executable with PyInstaller
      run: |
         pyinstaller pyinstaller.spec
      shell: bash

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_name: CodyCBakerPhD/como_recipes_public
        repo_token: ${{ inputs.GITHUB_TOKEN }}
        file: ./dist/${{ steps.executable_stem.outputs.value }}.exe
        asset_name: ${{ steps.executable_stem.outputs.value }}.exe
        tag: ${{ steps.package_version.outputs.value }}
        release_name: ${{ steps.package_version.outputs.value }}
        body: ${{ steps.package_version.outputs.value }} release of the CoMo Recipes app.
        overwrite: false  # Per-asset not per-release - false to prevent accidental overwrite of previous releases
        draft: true  # Only applies to first time this action is run for a given platform
        # (Note that the release must be taken out of draft for subsequent runs on different platforms to combine
        # multiple assets; otherwise, they go to different releases due to tag not existing yet)
