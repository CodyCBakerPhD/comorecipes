name: Bug Report
description: Report a bug from the interactive command line interface tool.
title: "[Bug]: "
labels: ["category: bug"]

body:
  - type: markdown
    attributes:
      value: |
        # Thank you for taking the time to fill out this bug report!
        ### The following information will help us resolve your issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        What were you trying to do?

        Please describe the 
    validations:
      required: true
  - type: textarea
    id: package_versions
    attributes:
      label: Package Versions
      description: |
        Please share your currently installed Python package versions by calling `pip list > environment_for_issue.txt` and uploading the text file along with this issue.

        This helps us determine if there are any secondary or tertiary issues caused by other dependencies.

        You can attach images or log files by clicking this area to highlight it and then dragging files in.
        If GitHub upload is not working, you can also copy and paste the output into this section.
      value: "<details> Copy and paste your output here </details>"
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS - Intel
        - macOS - 
        - Linux
        - N/A
      default:
        - N/A
  - type: dropdown
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/CodyCBakerPhD/como_recipes/blob/main/.github/CODE_OF_CONDUCT.rst)
      options:
        - Yes
