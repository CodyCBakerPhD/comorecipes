<h1>Tuscan Seasoning</h1>

<p>Tags: Component</p>



<br>
<h2>Ingredients</h2>

<p>3 grams crushed basil</p>
<p>2 grams rosemary</p>
<p>4 grams oregano</p>
<p>6 grams garlic powder</p>
<p>2 grams cayenne</p>
<p>2 grams fennel</p>
<p>3 grams salt and pepper</p>



<h2>Instructions</h2>

<p>Mix and store in an airtight container.</p>
