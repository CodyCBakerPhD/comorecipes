<h1>Vegetarian Gravy</h1>

<p>Tags: American, Side, Vegetarian</p>



<br><h2>Ingredients</h2>

<p>57 grams butter</p>
<p>30 grams flour</p>
<p>480 grams not-chicken broth</p>
<p>80 grams cream</p>
<p>5 grams salt and pepper</p>
<p>1 grams paprika</p>
<h2>Instructions</h2>

<p>Make roux with butter and flour. Thicken with stock. Season.</p>
