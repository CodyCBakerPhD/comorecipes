<h1>Vanilla Malt</h1>

<p>Tags: American, Dessert</p>



<br>
<h2>Ingredients</h2>

<p>150 grams ice cream</p>
<p>75 grams milk</p>
<p>10 grams malt powder</p>
<p>1 grams vanilla</p>



<br>
<h2>Notes</h2>

<p>Use chocolate ice cream and chocolate malt powder for a chocolate malt.</p>



<h2>Instructions</h2>

<p>Mix in mixer.</p>
