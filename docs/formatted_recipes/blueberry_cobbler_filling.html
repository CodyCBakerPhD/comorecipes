<h1>Blueberry Cobbler Filling</h1>

<p>Tags: Component</p>



<br><h2>Ingredients</h2>

<p>380 grams blueberries</p>
<p>22 grams sugar</p>
<p>12 grams brown sugar</p>
<p>5 grams lemon juice</p>
<h2>Instructions</h2>

<p>Mix all ingredients together in a bowl.</p>
