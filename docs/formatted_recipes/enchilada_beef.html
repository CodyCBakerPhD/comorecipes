<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchilada Beef · CoMo Recipes</title>
    <link rel="icon" href="../assets/como_icon.ico">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="recipe-page">
    <nav class="top-bar">
        <a class="brand" href="../index.html">CoMo Recipes</a>
        <a class="back-link" href="../index.html">&larr; Recipe Index</a>
    </nav>
    <main class="recipe">
        <header class="recipe-header">
            <h1>Enchilada Beef</h1>
            <ul class="tag-list">
                <li class="tag">Mexican</li>
                <li class="tag">Entree</li>
            </ul>
        </header>
        <div class="recipe-body">
            <section class="ingredients">
                <h2>Ingredients</h2>
                <ul class="ingredient-list">
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">1</span> (24 oz.) chuck roast</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">enough</span> olive oil</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">24 grams</span> flour</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">4 grams</span> salt and pepper</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">240 grams</span> water</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">15 grams</span> beef concentrate</span>
                    </label></li>
                </ul>
            </section>
            <div class="method">
                <section class="instructions">
                    <h2>Instructions</h2>
                    <ol class="step-list">
                        <li>Dredge meat in flour and pepper. Brown in skillet.</li>
                        <li>Heat water to simmer, add beef concentrate.</li>
                        <li>Combine in crockpot, set to high for 1 hour. Turn to low for 6-7 hours.</li>
                    </ol>
                </section>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p>CoMo Recipes</p>
    </footer>
</body>
</html>
