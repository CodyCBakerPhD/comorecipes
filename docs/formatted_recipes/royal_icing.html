<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Icing · CoMo Recipes</title>
    <link rel="icon" href="../assets/como_icon.ico">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="recipe-page">
    <nav class="top-bar">
        <a class="brand" href="../index.html">CoMo Recipes</a>
        <a class="back-link" href="../index.html">&larr; Recipe Index</a>
    </nav>
    <main class="recipe">
        <header class="recipe-header">
            <h1>Royal Icing</h1>
            <ul class="tag-list">
                <li class="tag">Vegetarian</li>
                <li class="tag">Dessert</li>
            </ul>
        </header>
        <div class="recipe-body">
            <section class="ingredients">
                <h2>Ingredients</h2>
                <ul class="ingredient-list">
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">1</span> egg whites</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">150 grams</span> sugar</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">2.8 grams</span> light corn syrup</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">80 grams</span> cold water</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">1 grams</span> salt</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">4 grams</span> vanilla</span>
                    </label></li>
                </ul>
            </section>
            <div class="method">
                <section class="instructions">
                    <h2>Instructions</h2>
                    <ol class="step-list">
                        <li>Combine all ingredients except vanilla in top of double boiler.</li>
                        <li>Beat at high speed while cooking until peaks form, ~8 minutes.</li>
                        <li>Remove from heat and add vanilla.</li>
                    </ol>
                </section>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p>CoMo Recipes</p>
    </footer>
</body>
</html>
