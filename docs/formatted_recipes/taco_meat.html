<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taco Meat · CoMo Recipes</title>
    <link rel="icon" href="../assets/como_icon.ico">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="recipe-page">
    <nav class="top-bar">
        <a class="brand" href="../index.html">CoMo Recipes</a>
        <a class="back-link" href="../index.html">&larr; Recipe Index</a>
    </nav>
    <main class="recipe">
        <header class="recipe-header">
            <h1>Taco Meat</h1>
            <ul class="tag-list">
                <li class="tag">American</li>
                <li class="tag">Vegetarian</li>
                <li class="tag">Entree</li>
                <li class="tag">Spicy</li>
            </ul>
        </header>
        <div class="recipe-body">
            <section class="ingredients">
                <h2>Ingredients</h2>
                <ul class="ingredient-list">
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">enough</span> avocado oil</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">453 grams</span> ground beef or refried beans or Boca</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">24.5 grams</span> taco seasoning</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">enough</span> water</span>
                    </label></li>
                </ul>
            </section>
            <div class="method">
                <section class="instructions">
                    <h2>Instructions</h2>
                    <ol class="step-list">
                        <li>Sear meat until brown.</li>
                        <li>Add spice and water.</li>
                        <li>Cook off water to allow base to absorb spice, deglaze the pan, and allow meat to be slightly moist.</li>
                    </ol>
                </section>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p>CoMo Recipes</p>
    </footer>
</body>
