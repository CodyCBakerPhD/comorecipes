<h1>Meatloaf Glaze</h1>

<p>Tags: Component</p>



<br><h2>Ingredients</h2>

<p>90 grams ketchup</p>
<p>5 grams white vinegar</p>
<p>11 grams brown sugar</p>
<p>1 grams garlic powder</p>
<p>1 grams onion powder</p>
<h2>Instructions</h2>

<p>Mix together until smooth.</p>
