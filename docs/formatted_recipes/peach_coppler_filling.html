<h1>Peach Cobbler Filling</h1>

<p>Tags: Component</p>



<br>
<h2>Ingredients</h2>

<p>4 peaches</p>
<p>12 grams sugar</p>
<p>12 grams brown sugar</p>
<p>0.5 grams cinnamon</p>
<p>0.5 grams nutmeg</p>
<p>5 grams lemon juice</p>



<h2>Instructions</h2>

<p>Peel and slice peaches.</p>
<p>Mix all ingredients together in a bowl.</p>
