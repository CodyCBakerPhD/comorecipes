<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilled Vegetables · CoMo Recipes</title>
    <link rel="icon" href="../assets/como_icon.ico">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="recipe-page">
    <nav class="top-bar">
        <a class="brand" href="../index.html">CoMo Recipes</a>
        <a class="back-link" href="../index.html">&larr; Recipe Index</a>
    </nav>
    <main class="recipe">
        <header class="recipe-header">
            <h1>Grilled Vegetables</h1>
            <ul class="tag-list">
                <li class="tag">American</li>
                <li class="tag">Vegetarian</li>
                <li class="tag">Entree</li>
            </ul>
        </header>
        <div class="recipe-body">
            <section class="ingredients">
                <h2>Ingredients</h2>
                <ul class="ingredient-list">
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">2</span> mushrooms</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">2</span> squash</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">2</span> zucchini</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">1</span> eggplant</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">4</span> corn</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">200 grams</span> onion</span>
                    </label></li>
                </ul>
            </section>
            <div class="method">
                <section class="instructions">
                    <h2>Instructions</h2>
                    <ol class="step-list">
                        <li>Grill all vegetables until perfect.</li>
                        <li>Glaze with melted butter throughout.</li>
                    </ol>
                </section>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p>CoMo Recipes</p>
    </footer>
</body>
</html>
