<h1>Grilled Vegetables</h1>

<p>Tags: American, Vegetarian, Entree</p>



<br>
<h2>Ingredients</h2>

<p>2 mushrooms</p>
<p>2 squash</p>
<p>2 zucchini</p>
<p>1 eggplant</p>
<p>4 corn</p>
<p>2 onion</p>



<h2>Instructions</h2>

<p>Grill all vegetables until perfect.</p>
<p>Glaze with melted butter throughout.</p>
