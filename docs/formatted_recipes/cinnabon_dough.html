<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinnabon Dough · CoMo Recipes</title>
    <link rel="icon" href="../assets/como_icon.ico">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="recipe-page">
    <nav class="top-bar">
        <a class="brand" href="../index.html">CoMo Recipes</a>
        <a class="back-link" href="../index.html">&larr; Recipe Index</a>
    </nav>
    <main class="recipe">
        <header class="recipe-header">
            <h1>Cinnabon Dough</h1>
            <ul class="tag-list">
                <li class="tag">Component</li>
            </ul>
        </header>
        <div class="recipe-body">
            <section class="ingredients">
                <h2>Ingredients</h2>
                <ul class="ingredient-list">
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">3.5 grams</span> yeast</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">50 grams</span> sugar</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">125 grams</span> warm milk</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">1</span> egg , room temperature</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">36 grams</span> margarine</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">270 grams</span> bread flour</span>
                    </label></li>
                    <li class="ingredient"><label>
                        <input type="checkbox">
                        <span class="ingredient-text"><span class="amount">3 grams</span> salt</span>
                    </label></li>
                </ul>
            </section>
            <div class="method">
                <section class="instructions">
                    <h2>Instructions</h2>
                    <ol class="step-list">
                        <li>Active yeast in milk with a bit of the sugar.</li>
                        <li>Combine with dry ingredients, egg, and margarine.</li>
                        <li>Let rise for 1 hour.</li>
                    </ol>
                </section>
            </div>
        </div>
    </main>
    <footer class="site-footer">
        <p>CoMo Recipes</p>
    </footer>
</body>
</html>
