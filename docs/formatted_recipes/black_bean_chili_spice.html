<h1>Black Bean Chili Spice</h1>

<p>Tags: Component</p>



<br>
<h2>Ingredients</h2>

<p>160 grams chili powder</p>
<p>50 grams cumin</p>
<p>20 grams oregano</p>
<p>30 grams salt</p>
<p>5 grams cayenne pepper</p>



<br>
<h2>Notes</h2>

<p>Makes about 10 servings of chili.</p>



<h2>Instructions</h2>

<p>Mix thoroughly and store in airtight container.</p>
