<h1>Piperade Sauce</h1>

<p>Tags: Italian, Vegetarian, Entree</p>



<br><h2>Ingredients</h2>

<p>1 marinara sauce</p>
<p>4 grilled red bell pepper</p>
<h2>Instructions</h2>

<p>Grill peppers ahead of time.</p>
<p>Place in plastic bags to steam.</p>
<p>Remove skins and seeds.</p>
<p>Make marinara as normal, but at the end add peppers and emulsify.</p>
