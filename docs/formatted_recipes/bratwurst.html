<h1>Bratwurst</h1>

<p>Tags: German, Entree</p>



<br>
<h2>Ingredients</h2>

<p>2 beer</p>
<p>58 grams butter</p>
<p>100 grams onion</p>
<p>10 grams garlic</p>
<p>1 bratwurst or veggie brats</p>



<h2>Instructions</h2>

<p>Heat beer and other non-brat ingredients.</p>
<p>Parboil brats for about 10 minutes.</p>
<p>Grill until lightly charred.</p>
