<h1>Bechamel Sauce</h1>

<p>Tags: European, Vegetarian</p>



<br><h2>Ingredients</h2>

<p>28 grams butter</p>
<p>16 grams flour</p>
<p>311 grams whole milk</p>
<p>2 grams salt and pepper</p>
<h2>Instructions</h2>

<p>Make roux with butter and flour. Thicken with milk. Season.</p>
