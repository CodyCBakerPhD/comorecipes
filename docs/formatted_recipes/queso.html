<h1>Queso</h1>

<p>Tags: Component</p>



<br>
<h2>Ingredients</h2>

<p>237 grams heavy cream</p>
<p>0.5 queso cheese</p>
<p>1 grams salt and pepper</p>



<h2>Instructions</h2>

<p>Heat cream.</p>
<p>Slowly whisk in cheese.</p>
<p>Season.</p>
