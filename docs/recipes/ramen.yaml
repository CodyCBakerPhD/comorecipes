name: Ramen

tags:
- Asian
- Vegetarian
- Entree

measurements:
- amount: '3'
  unit: portions
  ingredient: ramen noodles
- amount: '500'
  unit: grams
  ingredient: chicken stock
- amount: '200'
  unit: grams
  ingredient: white onion
- amount: '300'
  unit: grams
  ingredient: cabbage
- amount: '100'
  unit: grams
  ingredient: shiitake mushroom
- amount: '50'
  unit: grams
  ingredient: water
- amount: '10'
  unit: grams
  ingredient: soy sauce
- amount: '5'
  unit: grams
  ingredient: crushed red pepper
  

instructions:
- Boil water and cook ramen noodles separately. Drain and rinse with cool water.
- Cook onion until softened.
- Add cabbage, mushroom, and other vegetables. Cook until soft.
- Add a splash of chicken stock to deglaze the bottom of the pot.
- Continue adding chicken stock, water, soy sauce, and red pepper flakes. Bring to simmer, cook for 5 minutes.
- Add ramen noodles to broth.
