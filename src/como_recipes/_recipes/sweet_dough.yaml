name: Sweet Dough

tags:
- American
- Dessert
- Vegetarian

measurements:
- amount: '166'
  unit: grams
  ingredient:
    name: whole milk
- amount: '65'
  unit: grams
  ingredient:
    name: sugar
- amount: 7/4
  unit: tsp
  ingredient:
    name: yeast
- amount: '2'
  unit: eggs,
  ingredient:
    name: room temperature
- amount: '330'
  unit: grams
  ingredient:
    name: flour
- amount: '6'
  unit: grams
  ingredient:
    name: salt
- amount: '113'
  unit: grams
  ingredient:
    name: butter

instructions:
- Heat milk to 110 F in small saucepan over medium heat.
- Stir in 1 tbsp sugar and yeast.
- Let sit for 5 minutes.
- Add eggs.
- Combine remaining dry ingredients then knead into dough.
- Let prove for 90 minutes.

notes:
- Butter should be room temperature; take out well in advance.
