name: Honey Garlic Salmon

tags:
- American
- Entree

measurements:
- amount: '4'
  unit: salmon
  ingredient:
    name: fillets, 250 g each
- amount: '3'
  unit: grams
  ingredient:
    name: salt
- amount: 1/2
  unit: tsp
  ingredient:
    name: black pepper
- amount: '2'
  unit: grams
  ingredient:
    name: paprika
- amount: '2'
  unit: tbsp
  ingredient:
    name: butter
- amount: '4'
  unit: cloves
  ingredient:
    name: garlic, finely chopped
- amount: '4'
  unit: tbsp
  ingredient:
    name: honey
- amount: '15'
  unit: grams
  ingredient:
    name: water
- amount: '2'
  unit: tsp
  ingredient:
    name: soy sauce
- amount: '1'
  unit: tbsp
  ingredient:
    name: fresh lemon juice
- amount: '4'
  unit: lemon
  ingredient:
    name: wedges to garnish

instructions:
- Move oven shelf to middle. Preheat to broil/grill settings on medium heat. Season
  salmon with salt, pepper, paprika. Set aside.
- Heat butter in a skillet over medium-high heat until melted. Add garlic and saute
  for a minute. Pour in honey, water, and soy sauce. Allow flavors to heat through.
- Add lemon juice, stir well to combine. Add the salmon to the sauce in the pan, cook
  each fillet for 3-4 minutes or until golden. Baste the tops with the pan juices.
- Season with salt and pepper to taste. Add lemon wedges around salmon if desired.
  Baste salmon one more time, transfer pan to the oven to broil/grill for 5-6 minutes.
- To serve, drizzle with sauce and a squeeze of lemon juice.
