name: Collard Greens

tags:
- American
- Side
- Vegetarian
- Spicy

measurements:
- amount: '3'
  unit: tbsp
  ingredient:
    name: olive oil
- amount: '250'
  unit: grams
  ingredient:
    name: white onion
- amount: '10'
  unit: grams
  ingredient:
    name: garlic
- amount: '6'
  unit: grams
  ingredient:
    name: salt
- amount: '1'
  unit: tsp
  ingredient:
    name: pepper
- amount: '3'
  unit: cups
  ingredient:
    name: chicken flavored vegetable broth
- amount: '1'
  unit: pinch
  ingredient:
    name: red pepper flakes
- amount: '1'
  unit: lb.
  ingredient:
    name: fresh collard greens

instructions:
- Heat oil in very large pot over medium heat.
- Add onion, cook until tender. Add garlic. Add collard greens, fry until they wilt.
- Pour in broth, season with spices. Reduce heat to low, cover, and simmer for 45
  minutes or until tender.
