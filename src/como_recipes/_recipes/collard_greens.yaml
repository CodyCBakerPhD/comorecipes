name: Collard Greens

tags:
- American
- Side
- Vegetarian
- Spicy

measurements:
- amount: '13.5'
  unit: grams
  ingredient: olive oil
- amount: '250'
  unit: grams
  ingredient: white onion
- amount: '10'
  unit: grams
  ingredient: garlic
- amount: '6'
  unit: grams
  ingredient: salt
- amount: '1'
  unit: tsp
  ingredient: pepper
- amount: '3'
  unit: cups
  ingredient: chicken flavored vegetable broth
- amount: '1'
  unit: grams
  ingredient: red pepper flakes
- amount: '1'
  unit: lb.
  ingredient: fresh collard greens

instructions:
- Heat oil in very large pot over medium heat.
- Add onion, cook until tender. Add garlic. Add collard greens, fry until they wilt.
- Pour in broth, season with spices. Reduce heat to low, cover, and simmer for 45
  minutes or until tender.
