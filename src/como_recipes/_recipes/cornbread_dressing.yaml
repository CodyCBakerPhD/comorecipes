name: Cornbread Dressing

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '2'
  unit: portions
  ingredient: of cornbread
- amount: '28'
  unit: grams
  ingredient: butter
- amount: 1/2
  unit: cup
  ingredient: chopped celery
- amount: '75'
  unit: grams
  ingredient: white onion
- amount: '2'
  unit: cups
  ingredient: not-chicken stock
- amount: '2'
  unit: tbsp
  ingredient: dried sage
- amount: '3'
  unit: grams
  ingredient: salt
- amount: 1/2
  unit: tsp
  ingredient: pepper

instructions:
- Make cornbread 1-2 days in advance, crumble and leave to dry. Melt butter and saute
  celery and onion until soft.
- Combine with cornbread. If not stuffing into turkey, then incorporate stock and
  spices. If stuffing, only incorporate the spices.
- Bake for 30 minutes at 350 F.
