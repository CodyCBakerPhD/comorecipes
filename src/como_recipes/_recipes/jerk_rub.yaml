name: Jerk Rub

tags:
- Jamaican
- Vegetarian
- Entree
- Spicy

measurements:
- amount: '2'
  unit: grams
  ingredient:
    name: garlic powder
- amount: '3'
  unit: grams
  ingredient:
    name: cumin
- amount: 1/4
  unit: tsp
  ingredient:
    name: coriander
- amount: '1'
  unit: grams
  ingredient:
    name: paprika
- amount: '1'
  unit: grams
  ingredient:
    name: salt and pepper
- amount: '14'
  unit: grams
  ingredient:
    name: olive oil

instructions:
- Mix dry ingredients and use oil to bind. For cooking with chicken, lather all sides
  and grill for 4-6 minutes on each side.
