- amount: '8'
  unit: oz.
  ingredient:
    name: elbow pasta
- amount: '57'
  unit: grams
  ingredient:
    name: butter
- amount: '30'
  unit: grams
  ingredient:
    name: flour
- amount: '2'
  unit: cups
  ingredient:
    name: of any combination between 2% milk (for thin consistency) and heavy cream
      (very thick texture)
- amount: '7'
  unit: oz.
  ingredient:
    name: English aged cheddar
- amount: '5'
  unit: grams
  ingredient:
