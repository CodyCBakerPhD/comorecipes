- Side
- Vegetarian

measurements:
- amount: '4'
  unit: portions
  ingredient:
    name: potatoes
- amount: 'enough'
  ingredient:
    name: olive oil
- amount: 'enough'
  ingredient:
    name: salt

instructions:
- Use aluminum foil for easy cleanup.
- Thoroughly scrub potatoes.
- Cut into quarters lengthwise.
- Rub all over with peanut oil and coat with a bit of large-grain salt.
- Bake for 45 min at 425 F.
