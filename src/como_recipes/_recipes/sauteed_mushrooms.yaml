name: Sauteed Mushrooms

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '42'
  unit: grams
  ingredient: olive oil
- amount: '42'
  unit: grams
  ingredient: butter
- amount: '1'
  unit: lb.
  ingredient: button mushrooms
- amount: '5'
  unit: grams
  ingredient: garlic
- amount: '1'
  unit: tbsp
  ingredient: red wine
- amount: 1/4
  unit: tsp
  ingredient: garlic salt
- amount: 1/4
  unit: tsp
  ingredient: pepper

instructions:
- Heat oil and butter in large saucepan over medium heat.
- Cook all ingredients until mushrooms are lightly browned.
- Reduce heat to low and simmer until mushrooms are tender, about 5-8 more minutes.
