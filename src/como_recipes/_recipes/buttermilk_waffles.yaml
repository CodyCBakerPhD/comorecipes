name: Buttermilk Waffles

tags:
- American
- Breakfast
- Vegetarian

measurements:
- amount: 5/2
  unit: tbsp
  ingredient:
    name: melted and cooled butter
- amount: '1'
  unit: large
  ingredient:
    name: egg
- amount: 1/2
  unit: cup
  ingredient:
    name: buttermilk
- amount: 1/3
  unit: tsp
  ingredient:
    name: vanilla extract
- amount: '60'
  unit: grams
  ingredient:
    name: flour
- amount: 2/3
  unit: tsp
  ingredient:
    name: baking powder
- amount: 1/3
  unit: tsp
  ingredient:
    name: baking soda
- amount: '2'
  unit: grams
  ingredient:
    name: sugar
- amount: '1'
  unit: grams
  ingredient:
    name: salt
- amount: '1'
  unit: tbsp
  ingredient:
    name: pearl sugar

instructions:
- Waffle will be best if all ingredients are at room temperature
- Heat waffle iron.
- In a large bowl, combine all dry ingredients. Create a depression for the buttermilk
  mixture.
- Beat the eggs in a large measuring cup until frothy. Add vanilla extract, buttermilk,
  and cooled melted butter. Beat until well combined.
- Pour into the depression and stir quickly but gently with a wooden spoon.
- '[Experimental]: Gently incorporate pearl sugar.'
- Use about 1/4 of batter per waffle. Cook until steam stops rising from the iron.
