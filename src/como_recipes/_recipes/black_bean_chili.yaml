name: Black Bean Chili

tags:
- American
- Vegetarian
- Entree
- Soup
- Spicy

measurements:
- amount: '20'
  unit: grams
  ingredient: garlic
- amount: '0.5'
  unit: portions
  ingredient: white onion
- amount: '1'
  unit: portions
  ingredient: fresh or canned (quart) tomatoes
- amount: '32'
  unit: grams
  ingredient: chili powder
- amount: '10'
  unit: grams
  ingredient: cumin
- amount: '4'
  unit: grams
  ingredient: oregano
- amount: '6'
  unit: grams
  ingredient: salt
- amount: '1'
  unit: grams
  ingredient: cayenne pepper
- amount: '1'
  unit: portions
  ingredient: black beans
- amount: 'enough'
