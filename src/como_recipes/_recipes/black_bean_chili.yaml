name: Black Bean Chili

tags:
- American
- Vegetarian
- Entree
- Soup
- Spicy

measurements:
- amount: '20'
  unit: grams
  ingredient:
    name: garlic
- amount: 1/3
  unit: portions
  ingredient:
    name: white onion
- amount: '1'
  unit: portions
  ingredient:
    name: fresh or canned (quart) tomatoes
- amount: '32'
  unit: grams
  ingredient:
    name: chili powder
- amount: '10'
  unit: grams
  ingredient:
    name: cumin
- amount: '4'
  unit: grams
  ingredient:
    name: oregano
- amount: '6'
  unit: grams
  ingredient:
    name: salt
- amount: '1'
  unit: grams
  ingredient:
    name: cayenne pepper
- amount: '1'
  unit: portions
  ingredient:
    name: black beans
- amount: 'enough'
  ingredient:
    name: peanut oil

instructions:
- Carefully caramelize onions and garlic. Add tomatoes. Mix all dry ingredients separately
  and add to mixture. Add beans and oil. Stir and simmer for at least 15 minutes.
