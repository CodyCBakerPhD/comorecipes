name: Creamed Genoise

tags:
- British
- Dessert
- Vegetarian

measurements:
- amount: '188'
  unit: grams
  ingredient:
    name: butter, room temperature
- amount: '188'
  unit: grams
  ingredient:
    name: sugar
- amount: '3'
  unit: ''
  ingredient:
    name: beaten eggs, room temperature
- amount: '187'
  unit: grams
  ingredient:
    name: cake flour
- amount: '1'
  unit: ''
  ingredient:
    name: tsp baking powder
- amount: '25'
  unit: grams
  ingredient:
    name: milk
- amount: '1'
  unit: ''
  ingredient:
    name: tsp vanilla extract

instructions:
- Preheat to 350 F.
- Cream butter and sugar with wooden spoon, then set in stand mixer on medium-high
  for about two minutes, constantly scraping the sides.
- Then begin adding very small drizzle of the egg into the butter mixture while it
  remains in the stand mixer on medium-high. Continue until all egg is incorporated.
- Now remove from stand mixer and over the course of several gentle folds, sift and
  incorporate the flour and baking powder.
- Halfway through the folding, add half the milk/vanilla mixture. Add remaining at
  the end.
- Bake for around 20 minutes.
