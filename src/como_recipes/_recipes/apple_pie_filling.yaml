instructions:
- Peel and core apples; slice thinly. Toss apples with all dry ingredients except
  raw sugar. Cover and refrigerate for at least 4 hours.
- Drain and reserve liquid in a small saucepan; bring liquid to simmer and reduce
  by half (stir constantly).
- Pour over apples and toss to combine. Pour into pie crust and seal. Sprinkle with
  raw sugar.
- Bake to pie crust instructions.
