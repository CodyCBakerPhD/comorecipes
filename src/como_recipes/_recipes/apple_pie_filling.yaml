name: Apple Pie Filling

tags:
- American
- Dessert
- Pie
- Vegetarian
- Fruit

measurements:
- amount: '1'
  unit: unit
  ingredient:
    name: pie crust
- amount: '1360'
  unit: grams
  ingredient:
    name: Granny Smith apples (about 5)
- amount: '28'
  unit: grams
  ingredient:
    name: butter
- amount: 1/4
  unit: cup
  ingredient:
    name: sugar
- amount: 1/4
  unit: cup
  ingredient:
    name: brown sugar
- amount: '1'
  unit: tbsp
  ingredient:
    name: lemon juice
- amount: '2'
  unit: tsp
  ingredient:
