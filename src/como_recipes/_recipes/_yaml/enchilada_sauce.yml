name: Enchilada Sauce

tags:
- Mexican
- Vegetarian
- Entree
- Spicy

measurements:
- amount: 1/4
  unit: cup
  ingredient:
    name: vegetable oil
- amount: '15'
  unit: grams
  ingredient:
    name: flour
- amount: 1/4
  unit: cup
  ingredient:
    name: dark chili powder
- amount: '8'
  unit: oz.
  ingredient:
    name: can tomato sauce
- amount: '360'
