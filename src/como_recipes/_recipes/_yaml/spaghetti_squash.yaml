name: Spaghetti Squash

tags:
- Italian
- Vegetarian
- Entree
- Pasta

measurements:
- amount: '1'
  unit: spaghetti
  ingredient:
    name: squash
- amount: '1'
  unit: tbsp
  ingredient:
    name: olive oil
- amount: '4'
  unit: grams
  ingredient:
    name: salt and pepper

instructions:
- Cut and clean inside of squash.
- Coat with oil and season.
- Place face down on baking sheet lined with aluminum foil.
- Bake for 40 minutes at 375 F.
