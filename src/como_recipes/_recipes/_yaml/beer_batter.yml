name: Beer Batter

tags:
- American
- Vegetarian
- Entree

measurements:
- amount: '240'
  unit: grams
  ingredient:
    name: flour
- amount: 1/3
  unit: cup
  ingredient:
    name: cornstarch
- amount: '6'
  unit: grams
  ingredient:
    name: salt
- amount: '3'
  unit: grams
  ingredient:
    name: paprika
- amount: '1'
  unit: tbsp
  ingredient:
    name: baking powder
- amount: '12'
  unit: oz.
  ingredient:
    name: beer

instructions:
- Whisk dry ingredients. Add beer and incorporate. Mixture should feel like pancake
  batter.
- Cook 2-3 minutes per side in 375 F oil.
