name: Millionaire Shortbread

tags:
- British
- Dessert
- Vegetarian

measurements:
- amount: '1'
  unit: recipes
  ingredient:
    name: worth of shortbread
- amount: '1'
  unit: recipes
  ingredient:
    name: worth of simple caramel
- amount: '1'
  unit: recipes
  ingredient:
    name: worth of chocolate ganache

instructions:
- Make shortbread, let cool at least 15 minutes.
- Make simple caramel, and spread over shortbread. Let cool for several hours at room
  temperature or 1 hour in refrigerator.
- Make chocolate ganache, spread over caramel. Allow to harden before cutting.
