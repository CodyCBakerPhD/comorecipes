name: Baked Potato

tags:
- American
- Entree
- Side
- Vegetarian

measurements:
- amount: '4'
  unit: Good
  ingredient:
    name: big potatoes
- amount: '1'
  unit: tsp
  ingredient:
    name: olive oil
- amount: 1/4
  unit: tsp
  ingredient:
    name: large-grain salt

instructions:
- Use aluminum foil for easy cleanup.
- Thoroughly scrub potatoes.
- Cut into quarters lengthwise.
- Rub all over with peanut oil and coat with a bit of large-grain salt.
- Bake for 45 min at 425 F.
