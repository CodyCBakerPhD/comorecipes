name: Grape Salad

tags:
- American
- Dessert
- Side
- Vegetarian
- Fruit

measurements:
- amount: '8'
  unit: oz.
  ingredient: cream cheese, softened
- amount: '8'
  unit: oz.
  ingredient: sour cream
- amount: '8'
  unit: grams
  ingredient: vanilla
- amount: '2'
  unit: lb
  ingredient: red seedless grapes
- amount: '2'
  unit: lbs
  ingredient: green seedless grapes
- amount: '33'
  unit: grams
  ingredient: brown sugar
- amount: '3'
  unit: tbsp
  ingredient: chopped pecans

instructions:
- In a large bowl, beat the cream cheese, sour cream, sugar and vanilla until blended.
  Add grapes and toss to coat.
- Transfer to a serving bowl. Cover and refrigerate until serving. Sprinkle with brown
  sugar and pecans just before serving
- 'Note: Makes 21-24 servings'
