name: Fettuccine Alfredo

tags:
- Italian
- Vegetarian
- Entree
- Pasta

measurements:
- amount: '3'
  unit: eggs
  ingredient:
    name: worth of fettuccine noodles
- amount: 1/4
  unit: cup
  ingredient:
    name: butter
- amount: '1'
  unit: cup
  ingredient:
    name: heavy cream
- amount: '3'
  unit: cloves
  ingredient:
    name: crushed garlic
- amount: '1'
  unit: 1/2
  ingredient:
    name: cups freshly grated Parmesan
- amount: 1/2
  unit: tbsp
  ingredient:
    name: fresh parsley

instructions:
- Melt butter in saucepan over medium heat.
- Add cream and garlic, simmer for 5 minutes.
- Add most of the cheese, whisk quickly.
- Add rest of cheese just before serving.
- Garnish with the parsley if desired.
