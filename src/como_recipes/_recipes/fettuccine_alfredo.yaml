name: Fettuccine Alfredo

tags:
- Italian
- Vegetarian
- Entree
- Pasta

measurements:
- amount: '3'
  unit: eggs
  ingredient: worth of fettuccine noodles
- amount: '57'
  unit: grams
  ingredient: butter
- amount: '240'
  unit: grams
  ingredient: heavy cream
- amount: '3'
  unit: cloves
  ingredient: crushed garlic
- amount: '1'
  unit: 1/2
  ingredient: cups freshly grated Parmesan
- amount: 1/2
  unit: tbsp
  ingredient: fresh parsley

instructions:
- Melt butter in saucepan over medium heat.
- Add cream and garlic, simmer for 5 minutes.
- Add most of the cheese, whisk quickly.
- Add rest of cheese just before serving.
- Garnish with the parsley if desired.
