instructions:
- Preheat to 350 F. Whip eggs and sugar until thick and frothy. Fold in flour. Bake
  in round bowl for 1 hour.
- Whip cream, fold in melted chocolate.
- Slice cake into three layers and fill evenly with mousse. Lay saran wrap large and
  flat enough to cover the surface of the cake.
- Melt milk chocolate and delicately spread on saran wrap. Carefully move into the
  bowl used to bake the cake, and gently place cake back in the bowl.
- Refrigerate until chocolate has bound and solidified.
- Blend sauce ingredients, keep cold until served.
