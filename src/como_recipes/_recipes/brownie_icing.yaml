name: Brownie Icing

tags:
- American
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '18'
  unit: grams
  ingredient:
    name: Dutch cocoa
- amount: '38'
  unit: grams
  ingredient:
    name: butter
- amount: '29'
  unit: grams
  ingredient:
    name: powdered sugar
- amount: '9'
  unit: grams
  ingredient:
    name: evaporated milk
- amount: '2'
  unit: grams
  ingredient:
    name: vanilla

notes:
  - DO not forget to sift all dry ingredients.

instructions:
- Do not forget to sift dry ingredients.
- Melt butter in saucepan. Add sifted cocoa and remove pan from heat.
- Stir in sifted powdered sugar and other ingredients, saving vanilla for last to
  keep it smooth.
- Add more powdered sugar as necessary for consistency.
