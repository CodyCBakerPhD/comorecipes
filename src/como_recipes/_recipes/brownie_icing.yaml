name: Brownie Icing

tags:
- American
- Dessert
- Vegetarian
- Chocolate

measurements:
- amount: '1'
  unit: tbsp
  ingredient:
    name: sifted Dutch cocoa
- amount: '38'
  unit: grams
  ingredient:
    name: butter
- amount: 1/4
  unit: cups
  ingredient:
    name: sifted powdered sugar
- amount: '1'
  unit: tbsp
  ingredient:
    name: evaporated milk
- amount: 1/2
  unit: tsp
  ingredient:
    name: vanilla

instructions:
- Do not forget to sift dry ingredients.
- Melt butter in saucepan. Add sifted cocoa and remove pan from heat.
- Stir in sifted powdered sugar and other ingredients, saving vanilla for last to
  keep it smooth.
- Add more powdered sugar as necessary for consistency.
