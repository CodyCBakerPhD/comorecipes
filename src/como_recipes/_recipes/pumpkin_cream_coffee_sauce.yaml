name: Pumpkin Cream Coffee Sauce

tags:
- American
- Breakfast
- Vegetarian

measurements:
- amount: '1'
  unit: cup
  ingredient:
    name: heavy whipping cream
- amount: 1/2
  unit: cup
  ingredient:
    name: granulated sugar
- amount: '1'
  unit: tbsp
  ingredient:
    name: pumpkin puree
- amount: '1'
  unit: tsp
  ingredient:
    name: pumpkin pie spice
- amount: '4'
  unit: grams
  ingredient:
    name: vanilla

instructions:
- Combine heavy cream, sugar, pumpkin puree and pumpkin spice in a saucepan. Whisk
  over medium heat until sugar is dissolved and cream mixture begins to steam.
- DO NOT BOIL. Remove from heat and whisk in vanilla extract. Strain through a fine
  mesh strainer or cheesecloth, transfer to mason jar or pitcher.
- Refrigerate until cool.
