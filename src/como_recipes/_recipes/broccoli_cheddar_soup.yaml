name: Broccoli Cheddar Soup

tags:
- American
- Vegetarian
- Entree
- Soup

measurements:
- amount: '57'
  unit: grams
  ingredient: butter
- amount: '125'
  unit: grams
  ingredient: white onion
- amount: '1'
  unit: portions
  ingredient: broccoli
- amount: '198'
  unit: grams
  ingredient: not-chicken broth
- amount: '170'
  unit: grams
  ingredient: cheddar
- amount: '250'
  unit: grams
  ingredient: milk
- amount: '5'
  unit: grams
  ingredient: garlic powder
- amount: '15'
  unit: grams
  ingredient: cornstarch
- amount: '120'
  unit: grams
  ingredient: water

instructions:
- In pot, melt butter over medium heat.
- Cook onion until softened.
- Stir in broccoli and cover with not-chicken broth.
- Simmer until tender, 10-15 minutes.
- Reduce heat and stir in cheese cubes until melted.
- Mix in milk and garlic powder.
- In a small bowl, stir cornstarch into water until dissolved.
- Stir mixture into soup, cook, stirring frequently, until thick.
