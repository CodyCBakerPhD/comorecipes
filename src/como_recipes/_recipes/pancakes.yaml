name: Pancakes

tags:
- American
- Breakfast
- Vegetarian

measurements:
- amount: '120'
  unit: grams
  ingredient: flour
- amount: '2'
  unit: ''
  ingredient: tbsp sugar
- amount: '1'
  unit: ''
  ingredient: tsp baking powder
- amount: 1/2
  unit: ''
  ingredient: tsp baking soda
- amount: 1/2
  unit: ''
  ingredient: tsp salt
- amount: '1'
  unit: portions
  ingredient: egg
- amount: '2'
  unit: ''
  ingredient: tbsp butter
- amount: '1'
  unit: ''
  ingredient: cup buttermilk

instructions:
- Combine dry ingredients.
- Melt butter, mix with egg and buttermilk; whisk well.
- Cook on griddle.
