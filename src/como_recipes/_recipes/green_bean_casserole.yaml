name: Green Bean Casserole

tags:
- American
- Side
- Vegetarian

measurements:
- amount: '2'
  unit: cans
  ingredient:
    name: French-style green beans
- amount: '1'
  unit: can
  ingredient:
    name: cream of mushroom soup
- amount: '1'
  unit: can
  ingredient:
    name: French-fried onions
- amount: '125'
  unit: grams
  ingredient:
    name: milk
- amount: 1/8
  unit: tsp
  ingredient:
    name: pepper

instructions:
- Drain green beans. Mix soup, milk, pepper in a bowl. Add beans and mix together.
  Add half of the onions, give a quick stir.
- Place in casserole dish and bake for 25 minutes at 350 F. Add remaining onions to
  top and bake another 5 minutes, keeping close watch for burning.
