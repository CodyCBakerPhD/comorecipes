name: Nutella Bites

tags:
- American
- Dessert
- Breakfast
- Vegetarian
- Chocolate

measurements:
- amount: 3/2
  unit: ''
  ingredient:
    name: cups oats
- amount: 2/3
  unit: ''
  ingredient:
    name: cup Nutella
- amount: 1/2
  unit: ''
  ingredient:
    name: cu. shredded coconut
- amount: 1/2
  unit: ''
  ingredient:
    name: cup honey
- amount: 1/2
  unit: ''
  ingredient:
    name: cup roasted hazelnuts
- amount: '2'
  unit: ''
  ingredient:
    name: tsp vanilla extract
- amount: 1/4
  unit: ''
  ingredient:
    name: tsp salt

instructions:
- Combine all ingredients in large bowl and mix thoroughly.
- Cover and put in refrigerator for 30-60 minutes to make texture easier to mold.
- Roll balls of desired size and keep refrigerated.
