name: Cobbler Topping

tags:
- American
- Dessert
- Vegetarian

measurements:
- amount: '76'
  unit: grams
  ingredient:
    name: butter
- amount: 1/6
  unit: cup
  ingredient:
    name: white sugar
- amount: '36'
  unit: grams
  ingredient:
    name: brown sugar
- amount: '1'
  unit: portions
  ingredient:
    name: egg
- amount: '1'
  unit: grams
  ingredient:
    name: vanilla
- amount: '30'
  unit: grams
  ingredient:
    name: flour
- amount: '0.5'
  unit: grams
  ingredient:
    name: baking powder
- amount: '1'
  unit: grams
  ingredient:
    name: salt

instructions:
- Cream butter and sugar until light and fluffy.
- Mix flour, baking powder, and salt in separate bowl.
- Slowly incorporate flour mixture into butter mixture, until just combined.
- Drop spoonfuls onto wet mixture.
- Bake for 40 min at 375 F.
