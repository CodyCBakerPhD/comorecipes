- amount: '8'
  unit: egg
  ingredient:
    name: yolks
- amount: 3/4
  unit: cup
  ingredient:
    name: milk
- amount: 3/2
  unit: tsp
  ingredient:
    name: vanilla
- amount: '240'
  unit: grams
  ingredient:
    name: cake flour
- amount: '2'
  unit: tsp
  ingredient:
    name: baking powder
- amount: '3'
  unit: grams
  ingredient:
